# Build qc-- via docker.
# See also Dockerfile at the root of the project.

name: docker

on:
  pull_request_target: {}
  workflow_dispatch: null
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # submodules is required, not optional: qc links commons and profiling
      # from semgrep-pfff-libs, and Cap from caps. actions/checkout does not
      # fetch submodules by default, so without this they arrive as empty
      # directories, "COPY . ." ships nothing, and the build fails on a
      # missing "commons" library. It works locally only because the
      # submodules are already checked out in the working tree.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # optional if don't need multi-arch build
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t cmm .
